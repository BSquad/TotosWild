<!DOCTYPE html>
<html lang="de">

<head>
  <meta charset="UTF-8">
  <title>Totos Wild</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <!--<link rel="stylesheet" href="style.css?v=0.0.2">--> <!--TODO Nach Testen auf statisch wechseln-->
  <link rel="icon" type="image/png" href="images/favicon.png">
  <link rel="shortcut icon" type="image/png" href="images/favicon.png">
  <!-- Optional: als Shortcut Icon für ältere Browser -->
</head>

<body>

  <header>
    <h1>Toto's Wild- u. Honigspezialitäten</h1>
  </header>

  <main class="wrapper">
    <div id="loader" class="loader"></div>
    <div id="product-container"></div>
  </main>

  <footer>
    <button class="footer-btn" id="impressum-btn">Impressum</button>
    <button class="footer-btn" id="cart-btn">
      <img src="images/cart-icon.png" alt="Einkaufswagen" class="cart-icon">
    </button>

    <div class="product-legend">
      <div>Auf Lager<span class="legend-color in-stock"></span></div>
      <div>Vorbestellung<span class="legend-color no-stock"></span></div>
    </div>
  </footer>

  <!--<script src="script.js?v=0.0.2"></script>--> <!--TODO Nach Testen auf statisch wechseln-->

  <script> /*TODO Nach Testen löschen*/
    const timestamp = new Date().getTime();

    // CSS dynamisch laden
    const link = document.createElement("link");
    link.rel = "stylesheet";
    link.href = "style.css?v=" + timestamp;
    document.head.appendChild(link);

    // JS dynamisch laden
    const script = document.createElement("script");
    script.src = "script.js?v=" + timestamp;
    document.body.appendChild(script);
  </script>

</body>

</html>
